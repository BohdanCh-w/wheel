version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    cyclop:
      max-complexity: 40
    gosec:
      excludes:
        - G115 # integer converion overflow
    # staticcheck:
    #   checks:
    #     - all
        # - -SA1019
    wrapcheck:
      ignore-sigs:
        - web.Respond
        - web.Abort
        - web.NewError
        - fmt.Errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bohdanch-w/wheel
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
